# Kenya country profile. See _template.yaml for every option.
# Swahili text is a DRAFT for review by KMD / local extension experts.
id: kenya                      # = pipeline domain (s3://<bucket>/published/kenya/)
name: {en: Kenya, sw: Kenya}
flag: "🇰🇪"
iso2: KE
description:
  en: Rainfall, season timing, crop, drought, heat and livestock outlooks with advisories for 47 counties, down to the ward.
  sw: Utabiri wa mvua, wakati wa msimu, mazao, ukame, joto na mifugo pamoja na ushauri kwa kaunti 47, hadi ngazi ya wadi.
theme: {primary: "#1f6f78", accent: "#c98a2b"}   # optional per-country colours
languages: [en, sw]
default_language: en

map:
  center: [37.9, 0.3]          # lon, lat
  zoom: 6
  bbox: [33.5, -5.0, 42.0, 5.5]
  default_basemap: satellite   # satellite | light | streets | terrain

admin_levels:                  # ids match the boundaries levels published by the pipeline
  - {id: county, label: {en: County, sw: Kaunti}}
  - {id: sub_county, label: {en: Sub-county, sw: Kaunti ndogo}}
  - {id: ward, label: {en: Ward, sw: Wadi}}

seasons:                       # forecast start month -> season name
  - id: OND
    label: {en: Short rains, sw: Mvua za vuli}
    start_months: [9, 10, 11]
  - id: MAM
    label: {en: Long rains, sw: Masika}
    start_months: [2, 3, 4]
  - id: JJA
    label: {en: June–August rains, sw: Mvua za Juni–Agosti}
    start_months: [6, 7]
default_season_label: {en: Seasonal outlook, sw: Utabiri wa msimu}

layer_groups:                  # order = order in the layer menu; layers missing from a run are hidden
  - id: advisory
    label: {en: Advisory, sw: Ushauri}
    layers: [advisory_class, livelihood_stress, resilience_opportunity]
  - id: rainfall
    label: {en: Rainfall, sw: Mvua}
    layers: [rain_tercile_most_likely, rain_prob_below_normal, rain_prob_above_normal,
             rainfall_anomaly_percent, rainfall_total, rainfall_percentile,
             dry_spell_max, wet_spell_max, heavy_rain_days, very_heavy_rain_days]
  - id: season
    label: {en: Season timing, sw: Wakati wa msimu}
    layers: [onset_day, false_start_prob, cessation_day, growing_period]
  - id: crops
    label: {en: Crops and soil water, sw: Mazao na maji ya udongo}
    layers: [crop_water_stress, water_balance, input_timing, reference_et, growing_degree_days]
  - id: drought
    label: {en: Drought, sw: Ukame}
    layers: [drought_prob_spi3, spi_3, drought_prob_spei3, spei_3, agro_pastoral_drought]
  - id: heat
    label: {en: Temperature and heat, sw: Joto}
    layers: [temp_tercile_most_likely, temp_prob_above_normal, temp_prob_below_normal,
             tmax_anomaly, tmin_anomaly, heat_stress_days, hot_nights]
  - id: livestock
    label: {en: Livestock and pasture, sw: Mifugo na malisho}
    layers: [thi_risk_class, livestock_heat_days, pasture_drought, forage_growth, feed_water_stress,
             crop_residue, livestock_water_need, vector_suitability]
  - id: pastoral
    label: {en: "Mobility, water and hazards", sw: "Uhamaji, maji na hatari"}
    layers: [mobility_stress, grazing_conflict, water_pressure, surface_water_stress, mud_wetness, dust_dryness]
# Map opens on the first of these the chosen period has (advisory: whole forecast;
# rainfall: seasons, months, whole; temperature: also in a temperature-only preview).
default_layer: [advisory_class, rain_tercile_most_likely, temp_tercile_most_likely]
default_period: OND             # the Period selector opens here when the run has it

# Titles and short descriptions per language (English falls back to the pipeline's text).
# Kiswahili wording: please have a native speaker review before wide release.
layer_overrides:
  # ---- advisory
  advisory_class:
    title: {en: Seasonal advisory, sw: Ushauri wa msimu}
    classes:
      0: {en: Normal, sw: Kawaida}
      1: {en: Watch, sw: Tahadhari}
      2: {en: Alert, sw: Onyo}
      3: {en: Emergency, sw: Dharura}
  livelihood_stress:
    title: {en: Livelihood stress, sw: Shinikizo kwa maisha}
    description:
      en: Combined pressure on crops and livestock, compared with the same season in 1991–2020.
      sw: Shinikizo la pamoja kwa mazao na mifugo, ikilinganishwa na msimu huohuo 1991–2020.
  resilience_opportunity:
    title: {en: Good-season opportunity, sw: Fursa ya msimu mzuri}
    description:
      en: Where good rain, mild heat and a long growing period line up – a chance to invest or expand.
      sw: Mahali mvua nzuri, joto la wastani na kipindi kirefu cha ukuaji vinakutana – fursa ya kuwekeza.

  # ---- rainfall
  rain_tercile_most_likely:
    title: {en: Most likely rainfall, sw: Mvua inayotarajiwa zaidi}
    classes:
      1: {en: Below normal, sw: Chini ya kawaida}
      2: {en: Near normal, sw: Karibu na kawaida}
      3: {en: Above normal, sw: Juu ya kawaida}
  rain_prob_below_normal: {title: {en: Chance of below-normal rainfall, sw: Uwezekano wa mvua chini ya kawaida}}
  rain_prob_above_normal: {title: {en: Chance of above-normal rainfall, sw: Uwezekano wa mvua juu ya kawaida}}
  rainfall_anomaly_percent: {title: {en: Rainfall compared with normal, sw: Mvua ikilinganishwa na kawaida}}
  rainfall_total: {title: {en: Expected rainfall total, sw: Jumla ya mvua inayotarajiwa}}
  rainfall_percentile:
    title: {en: Rainfall rank against past years, sw: Nafasi ya mvua dhidi ya miaka iliyopita}
    description:
      en: Where the forecast total sits among 1991–2020 (50 = a typical year, 10 = one of the driest).
      sw: Nafasi ya jumla ya mvua kati ya miaka 1991–2020 (50 = mwaka wa kawaida, 10 = mojawapo ya mikavu zaidi).
  dry_spell_max:
    title: {en: Longest dry spell, sw: Kipindi kirefu zaidi cha ukavu}
    description: {en: Longest run of days with less than 1 mm of rain., sw: Siku nyingi mfululizo zenye mvua chini ya mm 1.}
  wet_spell_max:
    title: {en: Longest wet spell, sw: Kipindi kirefu zaidi cha mvua}
    description: {en: Longest run of days with at least 1 mm of rain., sw: Siku nyingi mfululizo zenye mvua ya mm 1 au zaidi.}
  heavy_rain_days: {title: {en: Heavy-rain days (20 mm+), sw: Siku za mvua kubwa (mm 20+)}}
  very_heavy_rain_days:
    title: {en: Very heavy rain days (50 mm+), sw: Siku za mvua kubwa sana (mm 50+)}
    description:
      en: Days that can bring flash floods, waterlogging and washed-out roads.
      sw: Siku zinazoweza kuleta mafuriko ya ghafla, maji kutuama na barabara kuharibika.

  # ---- season timing
  onset_day: {title: {en: Rainy-season onset, sw: Mwanzo wa mvua}}
  false_start_prob: {title: {en: Chance of a false start, sw: Uwezekano wa mwanzo wa uongo}}
  cessation_day:
    title: {en: End of the rainy season, sw: Mwisho wa msimu wa mvua}
    description:
      en: When the soil is expected to dry out after the rains.
      sw: Wakati udongo unatarajiwa kukauka baada ya mvua.
  growing_period:
    title: {en: Length of growing period, sw: Urefu wa kipindi cha ukuaji}
    description:
      en: Days between onset and the end of the season – compare with your crop's days to maturity.
      sw: Siku kati ya mwanzo na mwisho wa msimu – linganisha na siku ambazo zao lako huhitaji kukomaa.

  # ---- crops and soil water
  crop_water_stress:
    title: {en: Crop water stress, sw: Upungufu wa maji kwa mazao}
    description:
      en: How far rain and soil water fall short of what a crop needs (0 = none, 1 = severe).
      sw: Kiasi ambacho mvua na maji ya udongo hupungua dhidi ya mahitaji ya zao (0 = hakuna, 1 = kali).
  water_balance:
    title: {en: Water balance (rain minus crop need), sw: Mizani ya maji (mvua kutoa mahitaji ya zao)}
  input_timing:
    title: {en: Suitability for planting and inputs, sw: Ufaafu wa kupanda na pembejeo}
    description:
      en: How favourable onset, rainfall and dry-spell risk are for buying seed and fertiliser on time.
      sw: Jinsi mwanzo wa mvua, kiasi cha mvua na hatari ya ukavu vinavyofaa kununua mbegu na mbolea kwa wakati.
  reference_et:
    title: {en: Evaporative demand (ET0), sw: Mahitaji ya uvukizaji (ET0)}
    description:
      en: How much water the air pulls from soil and plants (FAO-56).
      sw: Kiasi cha maji ambacho hewa huvuta kutoka udongo na mimea (FAO-56).
  growing_degree_days: {title: {en: Growing degree days, sw: Joto la ukuaji (siku-digrii)}}

  # ---- drought
  drought_prob_spi3: {title: {en: Chance of drought (rainfall), sw: Uwezekano wa ukame (mvua)}}
  spi_3: {title: {en: Drought index (SPI-3), sw: Kiashiria cha ukame (SPI-3)}}
  drought_prob_spei3:
    title: {en: Chance of drought (rain and heat), sw: Uwezekano wa ukame (mvua na joto)}
    description:
      en: Like the rainfall index but also counts evaporation, so it picks up heat-driven drought.
      sw: Kama kiashiria cha mvua lakini huhesabu pia uvukizaji, hivyo hutambua ukame unaotokana na joto.
  spei_3: {title: {en: Drought index (SPEI-3), sw: Kiashiria cha ukame (SPEI-3)}}
  agro_pastoral_drought:
    title: {en: Agro-pastoral drought risk, sw: Hatari ya ukame kwa wakulima na wafugaji}

  # ---- temperature and heat (per season / month)
  temp_tercile_most_likely:
    title: {en: Most likely temperature, sw: Joto linalotarajiwa zaidi}
    classes:
      1: {en: Below normal, sw: Chini ya kawaida}
      2: {en: Near normal, sw: Karibu na kawaida}
      3: {en: Above normal, sw: Juu ya kawaida}
  temp_prob_above_normal: {title: {en: Chance of above-normal temperature, sw: Uwezekano wa joto juu ya kawaida}}
  temp_prob_below_normal: {title: {en: Chance of below-normal temperature, sw: Uwezekano wa joto chini ya kawaida}}
  tmax_anomaly:
    title: {en: Daytime temperature vs normal, sw: Joto la mchana ikilinganishwa na kawaida}
    description:
      en: Average daily maximum compared with the same months in 1991–2020 (°C warmer or cooler).
      sw: Wastani wa joto la juu la kila siku ikilinganishwa na miezi hiyo 1991–2020 (°C zaidi au chini).
  tmin_anomaly:
    title: {en: Night-time temperature vs normal, sw: Joto la usiku ikilinganishwa na kawaida}
    description:
      en: Average daily minimum compared with the same months in 1991–2020 (°C warmer or cooler).
      sw: Wastani wa joto la chini la kila siku ikilinganishwa na miezi hiyo 1991–2020 (°C zaidi au chini).
  heat_stress_days: {title: {en: Heat-stress days, sw: Siku za joto kali}}
  hot_nights:
    title: {en: Hot nights (24 °C+), sw: Usiku wenye joto (24 °C+)}
    description:
      en: Nights too warm for people, animals and crops to recover from daytime heat.
      sw: Usiku wenye joto kiasi kwamba watu, mifugo na mazao hawapumziki kutokana na joto la mchana.

  # ---- livestock and pasture
  thi_risk_class:
    title: {en: Peak livestock heat stress, sw: Kiwango cha juu cha joto kwa mifugo}
    classes:
      0: {en: Low, sw: Chini}
      1: {en: Mild, sw: Kidogo}
      2: {en: Moderate, sw: Wastani}
      3: {en: Severe, sw: Kali}
      4: {en: Emergency, sw: Dharura}
    description:
      en: Temperature–humidity index (THI) on the hottest days of the season.
      sw: Kiashiria cha joto na unyevu (THI) katika siku zenye joto zaidi za msimu.
  livestock_heat_days: {title: {en: Livestock heat-stress days, sw: Siku za joto kali kwa mifugo}}
  pasture_drought:
    title: {en: Pasture drought, sw: Ukame wa malisho}
    description:
      en: Rain deficit, high evaporation and dry soils together – how hard pasture will be hit.
      sw: Upungufu wa mvua, uvukizaji mkubwa na udongo mkavu – jinsi malisho yatakavyoathirika.
  forage_growth:
    title: {en: Forage growth outlook, sw: Matarajio ya ukuaji wa malisho}
    description:
      en: How favourable rain, soil moisture and temperature are for grass and browse.
      sw: Jinsi mvua, unyevu wa udongo na joto vinavyofaa kwa nyasi na majani ya miti.
  feed_water_stress: {title: {en: Feed and water stress, sw: Upungufu wa lishe na maji}}
  crop_residue: {title: {en: Crop residue (feed) outlook, sw: Matarajio ya mabaki ya mazao (lishe)}}
  livestock_water_need: {title: {en: Livestock drinking-water need, sw: Mahitaji ya maji ya kunywa kwa mifugo}}
  vector_suitability:
    title: {en: Disease-vector conditions, sw: Mazingira ya wadudu waenezao magonjwa}
    description:
      en: How suitable rain, humidity and temperature are for ticks, flies and mosquitoes.
      sw: Jinsi mvua, unyevu na joto vinavyofaa kwa kupe, nzi na mbu.

  # ---- mobility, water and hazards
  mobility_stress:
    title: {en: Herd mobility stress, sw: Shinikizo la kuhamisha mifugo}
    description:
      en: Pressure to move herds early or far in search of pasture and water.
      sw: Shinikizo la kuhamisha mifugo mapema au mbali kutafuta malisho na maji.
  grazing_conflict:
    title: {en: Planting–grazing conflict risk, sw: Hatari ya mgogoro wa kilimo na malisho}
    description:
      en: Where herds are likely to move into farmed areas around planting time.
      sw: Mahali mifugo inaweza kuingia mashambani wakati wa kupanda.
  water_pressure: {title: {en: Pressure on shared water, sw: Shinikizo kwa vyanzo vya maji vya pamoja}}
  surface_water_stress:
    title: {en: Surface-water stress (pans and dams), sw: Upungufu wa maji ya juu (mabwawa)}
  mud_wetness:
    title: {en: Mud and waterlogging risk, sw: Hatari ya matope na maji kutuama}
  dust_dryness:
    title: {en: Dust and dryness risk, sw: Hatari ya vumbi na ukavu}

advisories:                    # shown with the advisory class of the selected area
  advisory_class:
    0:
      en: >-
        Conditions close to or better than usual for this season. Plan planting
        and grazing as normal and follow the monthly updates.
      sw: >-
        Hali inatarajiwa kuwa ya kawaida au bora kuliko kawaida kwa msimu huu.
        Panga upanzi na malisho kama kawaida na fuatilia taarifa za kila mwezi.
    1:
      en: >-
        Somewhat worse than usual. Prepare: consider early-maturing or
        drought-tolerant varieties and plan water and pasture use.
      sw: >-
        Hali inaweza kuwa mbaya kidogo kuliko kawaida. Jitayarishe: fikiria mbegu
        zinazokomaa mapema au zinazostahimili ukame, na panga matumizi ya maji na malisho.
    2:
      en: >-
        Clearly worse than usual (about one season in four). Reduce risk: stagger
        planting, conserve water and fodder, and talk to your extension officer.
      sw: >-
        Hali mbaya kuliko kawaida (takriban msimu mmoja kati ya minne). Punguza hatari:
        panda kwa awamu, hifadhi maji na lishe ya mifugo, na zungumza na afisa wa ugani.
    3:
      en: >-
        Among the worst seasons on record (about one in eight). Act early: secure
        water and feed, consider destocking and follow county drought advisories.
      sw: >-
        Mojawapo ya misimu mibaya zaidi kuwahi kurekodiwa (takriban mmoja kati ya minane).
        Chukua hatua mapema: hakikisha maji na lishe, fikiria kupunguza mifugo na fuata
        ushauri wa ukame wa kaunti.

links:
  - {name: Kenya Meteorological Department, url: "https://meteo.go.ke"}
  - {name: "Alliance of Bioversity International and CIAT", url: "https://alliancebioversityciat.org"}
attribution: >-
  Forecast: ECMWF SEAS5 (Copernicus Climate Change Service), bias-corrected against
  AgERA5 1991–2020. Indices: AgClimateAF.
